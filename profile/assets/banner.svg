<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="PICO4yita — PICO × YITA Dynamics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="100%" stop-color="#151C27"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4FD1A5"/>
      <stop offset="100%" stop-color="#5B8CFF"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4FD1A5" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="300" fill="url(#accent)"/>

  <text x="80" y="104" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" fill="#7C8798" letter-spacing="6">YITA DYNAMICS × PICO</text>

  <text x="76" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="78" font-weight="700" fill="#F2F5F9" letter-spacing="-1.5">PICO<tspan fill="#4FD1A5">4</tspan>yita</text>

  <text x="1200" y="150" text-anchor="end" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="26" fill="#C7D0DD">让智能触达真实世界</text>
  <text x="1200" y="188" text-anchor="end" font-family="'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', sans-serif" font-size="15" fill="#7C8798">高性能关节模组 · 力控双臂 · 人形机器人软件栈</text>

  <line x1="80" y1="240" x2="1200" y2="240" stroke="url(#rule)" stroke-width="1"/>

  <text x="80" y="272" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#5C6675" letter-spacing="2">YITA-C SERIES JOINT MODULES</text>
  <text x="1200" y="272" text-anchor="end" font-family="'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="13" fill="#5C6675" letter-spacing="2">PICO ROBOT SOFTWARE STACK</text>
</svg>
